<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notepad Online</title>
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%23D77757'/></svg>">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <button id="btnSave" title="Save file" aria-label="Save">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z" />
        <path d="M17 21v-8H7v8M7 3v5h8" />
      </svg>
    </button>
    <button id="btnSettings" title="Settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3" />
        <path
          d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
      </svg>
    </button>
  </header>

  <main>
    <pre id="hl" aria-hidden="true"></pre>
    <textarea id="ed" spellcheck="false" autofocus placeholder="Start writing..."></textarea>
  </main>

  <dialog id="dlgSettings">
    <form method="dialog">
      <h2>Settings</h2>

      <fieldset>
        <legend>Theme</legend>
        <label class="inline"><input type="radio" name="theme" value="dark"> Dark</label>
        <label class="inline"><input type="radio" name="theme" value="light"> Light</label>
        <label class="inline"><input type="radio" name="theme" value="custom"> Custom</label>
      </fieldset>

      <fieldset id="customBox">
        <legend>Custom colors</legend>
        <label class="inline">Background <input type="color" id="cBg"></label>
        <label class="inline">Text <input type="color" id="cFg"></label>
      </fieldset>

      <fieldset id="langBox">
        <legend>Language colors</legend>
        <label class="inline"><input type="checkbox" id="langOn"> Enable</label>
        <label class="inline">Language
          <select id="lang">
          </select>
        </label>
      </fieldset>

      <fieldset>
        <legend>Layout</legend>
        <label class="inline">Horizontal padding
          <input type="number" id="padXVal" min="0" step="any">
          <select id="padXUnit">
            <option>px</option>
            <option>%</option>
            <option>vh</option>
            <option>vw</option>
          </select>
        </label>
        <label class="inline">Vertical padding
          <input type="number" id="padYVal" min="0" step="any">
          <select id="padYUnit">
            <option>px</option>
            <option>%</option>
            <option>vh</option>
            <option>vw</option>
          </select>
        </label>
        <label class="inline">Max width
          <input type="number" id="maxVal" min="0" step="any" placeholder="none">
          <select id="maxUnit">
            <option>px</option>
            <option>%</option>
            <option>vw</option>
            <option>ch</option>
          </select>
        </label>
      </fieldset>

      <div class="row end"><button class="primary">Close</button></div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>

</html>
